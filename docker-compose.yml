# ローカル開発用のミドルウェア。ポートは 127.0.0.1 だけで待ち受け、外部からは接続できないようにする。
# 接続情報は同じディレクトリの .env から読み込まれる。
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:?.env に DB_NAME を設定してください}
      POSTGRES_USER: ${DB_USERNAME:?.env に DB_USERNAME を設定してください}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env に DB_PASSWORD を設定してください}
    ports:
      # ホストの 5432 は OS の PostgreSQL が使っているため 5433 にする
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 以降のイメージはデータを /var/lib/postgresql 配下に置く
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web 画面

volumes:
  postgres-data:
