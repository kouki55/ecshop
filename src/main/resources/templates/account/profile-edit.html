<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お名前の変更 - ecshop</title>
</head>
<body>
<h1>お名前の変更</h1>

<form th:action="@{/account/profile}" th:object="${form}" method="post">
    <div>
        <label for="name">お名前</label>
        <input type="text" id="name" th:field="*{name}" maxlength="100" autocomplete="name" required>
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">エラー</p>
    </div>
    <button type="submit">変更する</button>
</form>

<p><a th:href="@{/account}">登録情報へ戻る</a></p>
</body>
</html>
