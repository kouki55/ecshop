<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>退会 - ecshop</title>
</head>
<body>
<h1>退会</h1>
<p>退会すると、お名前・メールアドレス・登録した住所は削除され、元に戻せません。</p>
<p>過去の注文の記録（注文時の配送先を含む）は残ります。</p>
<p>本人確認のため、現在のパスワードを入力してください。</p>

<form th:action="@{/account/withdraw}" th:object="${form}" method="post">
    <p th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">エラー</p>
    <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">エラー</p>
    </div>
    <button type="submit">退会する</button>
</form>

<p><a th:href="@{/account}">登録情報へ戻る</a></p>
</body>
</html>
