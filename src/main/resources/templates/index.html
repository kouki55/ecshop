<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ecshop</title>
</head>
<body>
<h1>ecshop</h1>
<p>カー用品の学習用 EC サイトです。</p>
<p><a th:href="@{/products}">商品一覧</a></p>

<div th:if="${loginEmail != null}">
    <p>ログイン中：<span th:text="${loginEmail}">member@example.com</span></p>
    <p><a th:href="@{/cart}">カート</a></p>
    <p><a th:href="@{/account}">登録情報</a></p>
    <!-- ログアウトは CSRF トークン付きの POST で行う（th:action がトークンを自動で埋め込む） -->
    <form th:action="@{/logout}" method="post">
        <button type="submit">ログアウト</button>
    </form>
</div>
<div th:if="${loginEmail == null}">
    <a th:href="@{/login}">ログイン</a>
    <a th:href="@{/register}">会員登録</a>
</div>
</body>
</html>
