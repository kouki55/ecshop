<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ご注文のキャンセル - ecshop</title>
</head>
<body>
<h1>ご注文のキャンセル</h1>

<p>注文番号 <span th:text="${order.id}">1</span>（<span th:text="${order.orderedAt}">2026年11月16日(月) 10:00</span>）をキャンセルします。</p>
<p>キャンセルすると元に戻せません。</p>
<p th:if="${order.status.name() == 'PAID'}">
    お支払いいただいた <span th:text="${#numbers.formatInteger(order.totalAmount, 1, 'COMMA')}">2,700</span>円 は全額返金します。
</p>

<ul>
    <li th:each="line : ${order.lines}">
        <span th:text="${line.productName}">エンジンオイル</span> ×
        <span th:text="${line.quantity}">2</span>
    </li>
</ul>

<!-- CSRF トークンは th:action が自動で埋め込む -->
<form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
    <button type="submit">キャンセルする</button>
</form>

<p><a th:href="@{/orders/{id}(id=${order.id})}">キャンセルせずに戻る</a></p>
</body>
</html>
