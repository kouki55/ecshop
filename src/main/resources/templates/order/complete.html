<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ご注文完了 - ecshop</title>
</head>
<body>
<h1>ご注文ありがとうございます</h1>
<p>ご注文の手続き：1. 配送先 → 2. 確認 → 3. お支払い → <strong>4. 完了</strong></p>

<p>お支払いを確認しました。ご登録のメールアドレスに確認メールをお送りします。</p>

<dl>
    <dt>注文番号</dt>
    <dd th:text="${order.id}">1</dd>
    <dt>注文日時</dt>
    <dd th:text="${order.orderedAt}">2026年11月16日(月) 10:00</dd>
    <dt>状態</dt>
    <dd th:text="${order.status.label()}">支払済</dd>
    <dt>お届け予定</dt>
    <dd th:text="${order.deliveryLabel}">2026年11月19日(木)〜2026年11月21日(土)</dd>
    <dt>お支払い合計（税込）</dt>
    <dd><span th:text="${#numbers.formatInteger(order.totalAmount, 1, 'COMMA')}">2,700</span>円</dd>
</dl>

<h2>ご注文の商品</h2>
<ul>
    <li th:each="line : ${order.lines}">
        <span th:text="${line.productName}">エンジンオイル</span> ×
        <span th:text="${line.quantity}">2</span>
    </li>
</ul>

<h2>お届け先</h2>
<p th:text="${order.recipientName} + ' 様'">山田太郎 様</p>
<p>〒<span th:text="${order.postalCode}">1000001</span> <span th:text="${order.address}">東京都千代田区千代田1-1</span></p>

<p><a th:href="@{/products}">買い物を続ける</a></p>
<p><a th:href="@{/}">トップページへ戻る</a></p>
</body>
</html>
