<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - ecshop</title>
</head>
<body>
<h1>ログイン</h1>

<!-- 失敗の理由（パスワード違い・未登録・仮登録・ロック中）は区別しない。区別するとアカウントの有無が分かってしまうため -->
<div th:if="${param.error}">
    <p>ログインできませんでした。メールアドレスとパスワードをご確認ください。</p>
    <p>仮登録の方は、確認メールのリンクを開いて登録を完了してください。</p>
    <p>続けて失敗すると、15分間ログインできなくなります。</p>
</div>
<p th:if="${param.logout}">ログアウトしました。</p>
<p th:if="${param.reset}">パスワードを変更しました。新しいパスワードでログインしてください。</p>
<p th:if="${param.expired}">パスワードの変更などにより、ログインが無効になりました。もう一度ログインしてください。</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" maxlength="254" autocomplete="username" required>
    </div>
    <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">ログイン</button>
</form>

<p><a th:href="@{/password/forgot}">パスワードを忘れた方はこちら</a></p>
<p><a th:href="@{/register}">会員登録はこちら</a></p>
</body>
</html>
