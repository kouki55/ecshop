<!DOCTYPE html>

    <title>メールを確認してください - ecshop</title>

<body>
<h1>メールを確認してください</h1>
<!-- 登録の有無が分からないよう、どのメールアドレスでも同じ文面にする -->
<p>入力されたメールアドレスが登録されていれば、パスワード再設定のリンクをお送りしました。</p>
<p>リンクの有効期限は30分です。メールが届かない場合は、メールアドレスを確認してもう一度お試しください。</p>
<p><a th:href="@{/login}">ログイン画面へ</a></p>
</body>
