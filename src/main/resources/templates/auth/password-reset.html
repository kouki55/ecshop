<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新しいパスワードの設定 - ecshop</title>
</head>
<body>
<h1>新しいパスワードの設定</h1>

<form th:action="@{/password/reset}" th:object="${form}" method="post">
    <input type="hidden" th:field="*{token}">
    <div>
        <label for="password">新しいパスワード（15〜64文字）</label>
        <!-- 入力エラーで画面を再表示しても、パスワードは書き戻さない（th:field を使わない） -->
        <input type="password" id="password" name="password" minlength="15" maxlength="64"
               autocomplete="new-password" required>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">エラー</p>
        <p>文字の種類の組み合わせは問いません。長めの文やフレーズがおすすめです。</p>
    </div>
    <button type="submit">パスワードを変更する</button>
</form>
</body>
</html>
