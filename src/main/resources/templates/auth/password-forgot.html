<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワードの再設定 - ecshop</title>
</head>
<body>
<h1>パスワードの再設定</h1>
<p>登録したメールアドレスを入力してください。パスワードを再設定するためのリンクをお送りします。</p>

<form th:action="@{/password/forgot}" th:object="${form}" method="post">
    <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" th:field="*{email}" maxlength="254" autocomplete="username" required>
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">エラー</p>
    </div>
    <button type="submit">再設定のリンクを送る</button>
</form>

<p><a th:href="@{/login}">ログイン画面へ戻る</a></p>
</body>
</html>
