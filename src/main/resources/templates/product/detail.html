<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - ecshop'">商品詳細 - ecshop</title>
    <style>
        /* 説明文の改行をそのまま表示する。th:utext で <br> を埋め込む方法は、エスケープが外れるので使わない */
        .description { white-space: pre-line; }
    </style>
</head>
<body>
<h1 th:text="${product.name}">エンジンオイル 5W-30 4L</h1>

<p>
    カテゴリ：
    <a th:href="@{/products(category=${product.categoryId})}" th:text="${product.categoryName}">エンジンオイル</a>
</p>
<p>
    税込 <span th:text="${#numbers.formatInteger(product.priceIncludingTax, 1, 'COMMA')}">3,850</span>円
    （税抜 <span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}">3,500</span>円、
    消費税率 <span th:text="${product.taxRatePercent}">10</span>%）
</p>
<p th:text="${product.stockStatus.label()}">在庫あり</p>

<p class="description" th:text="${product.description}">商品の説明</p>

<p><a th:href="@{/products}">商品一覧へ戻る</a></p>
</body>
</html>
